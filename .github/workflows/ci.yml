
name: First GitHub Actions Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Message
        run: echo "GitHub Actions Pipeline Started"

      - name: Check Repository
        run: ls -la

      - name: Pipeline Success
        run: echo "Pipeline executed successfully"
