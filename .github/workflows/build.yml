
name: Angular and Java CI

on:
  push:
    branches:
      - angular-code
      - java-code
  workflow_dispatch:

jobs:
  angular-build:
    if: github.ref == 'refs/heads/angular-code'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Angular Build
        run: npm run build

  java-build:
    if: github.ref == 'refs/heads/java-code'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Maven Build
        run: mvn clean package
